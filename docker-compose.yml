name: engram-rag-observability

services:
  engram-rag-dashboard:
    build: .
    container_name: engram.rag
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
    networks:
      - engram-rag-observability
    restart: unless-stopped

networks:
  engram-rag-observability:
    name: engram-rag-observability
