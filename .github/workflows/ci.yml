name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      # PR5 / #31 — the unified verify:all entry point. Runs the
      # focused tests, the static guardrails, the TypeScript
      # typecheck, and the mcp:smoke check end-to-end. The live P0
      # smoke is opt-in via ENGRAM_BASE_URL / ENGRAM_PROJECT and is
      # skipped on every CI run by --skip-live.
      - name: Run unified verify:all (PR5 / #31)
        run: npm run verify:all -- --skip-live

      - name: Run MCP smoke (PR5 / #31)
        run: npm run mcp:smoke

      - name: Run Phase 1 verify
        run: npm run verify:phase1

      - name: Run Phase 2 verify
        run: npm run verify:phase2

      - name: Run Phase 3 verify
        run: npm run verify:phase3

      - name: Run Phase 4 verify
        run: npm run verify:phase4
